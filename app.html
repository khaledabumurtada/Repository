<style>
  .article-page { max-width: 760px; margin: 0 auto; padding: 30px 20px 70px; }
  .article-back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-soft); text-decoration: none; font-size: 13.5px; margin-bottom: 20px; }
  .article-back:hover { color: var(--ink); }
  .article-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .article-icon { width: 64px; height: 64px; border-radius: 14px; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .article-icon img { width: 38px; height: 38px; object-fit: contain; }
  .article-head h1 { font-size: 26px; margin: 0 0 4px; font-family: var(--font-ar); }
  .article-domain { color: var(--ink-soft); font-size: 13.5px; }
  .article-cta { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--paper); text-decoration: none; padding: 12px 22px; border-radius: 999px; font-size: 15px; margin: 8px 0 26px; }
  .article-cta:hover { background: var(--amber-deep); }
  .article-body { font-size: 16px; line-height: 1.95; color: var(--ink); white-space: pre-line; }
  .article-body p { margin: 0 0 18px; }
  .article-empty { color: var(--ink-soft); font-size: 15px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .article-meta-cat { display: inline-block; background: var(--teal-soft); color: var(--teal); font-size: 12px; padding: 4px 12px; border-radius: 999px; margin-bottom: 10px; }
</style>

<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">دليلي<span class="dot">.</span></a>
    <div class="lang-toggle">
      <button data-lang="ar" class="active">العربية</button>
      <button data-lang="en">English</button>
    </div>
  </div>
</header>

<div class="article-page">
  <a href="index.html" class="article-back">‹ <span data-i18n="ar">رجوع للدليل</span><span data-i18n="en" style="display:none">Back to directory</span></a>

  <div id="article-content">
    <p class="article-empty" data-i18n="ar">جاري التحميل...</p>
    <p class="article-empty" data-i18n="en" style="display:none">Loading...</p>
  </div>

         style="display:block"

      <a href="privacy.html">سياسة الخصوصية / Privacy</a>
      <a href="contact.html">تواصل معنا / Contact</a>
    </div>
  </div>

<script src="data.js?v=20260919b"></script>
<script>
  function faviconUrl(domain) {
    return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
  }

  function getLang() {
    return localStorage.getItem("site_lang") || "ar";
  }

  function applyPageLang(lang) {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll(".lang-toggle button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
    document.querySelectorAll("[data-i18n]").forEach(el => {
      el.style.display = el.dataset.i18n === lang ? "" : "none";
    });
  }

  function renderArticle() {
    const lang = getLang();
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const app = (typeof APPS !== "undefined") ? APPS.find(a => a.id === id) : null;
    const container = document.getElementById("article-content");

    if (!app) {
      container.innerHTML = `<p class="article-empty">${lang === "ar" ? "ما لقينا هذه الأداة." : "We couldn't find this tool."}</p>`;
      return;
    }

    const name = lang === "ar" ? app.name_ar : app.name_en;
    const shortDesc = lang === "ar" ? app.desc_ar : app.desc_en;
    const article = lang === "ar" ? app.article_ar : app.article_en;
    const cat = (typeof CATEGORIES !== "undefined") ? CATEGORIES.find(c => c.slug === app.category) : null;
    const catName = cat ? (lang === "ar" ? cat.name_ar : cat.name_en) : "";
    const openLabel = lang === "ar" ? "افتح التطبيق ↗" : "Open App ↗";

    document.title = `${name} — دليلي`;
    document.getElementById("page-description").setAttribute("content", shortDesc || "");
    document.getElementById("page-canonical").setAttribute("href", `https://khaledabumurtada.github.io/Repository/app.html?id=${app.id}`);

    const bodyHtml = article
      ? `<div class="article-body">${article.split("\n\n").map(p => `<p>${p}</p>`).join("")}</div>`
      : `<p class="article-empty">${shortDesc}</p>`;

    container.innerHTML = `
      ${catName ? `<span class="article-meta-cat">${catName}</span>` : ""}
      <div class="article-head">
        <div class="article-icon"><img src="${faviconUrl(app.domain)}" alt=""></div>
        <div>
          <h1>${name}</h1>
          <div class="article-domain">${app.domain}</div>
        </div>
      </div>
      <a class="article-cta" href="${app.url}" target="_blank" rel="noopener noreferrer nofollow">${openLabel}</a>
      ${bodyHtml}
    `;
  }

  document.querySelectorAll(".lang-toggle button").forEach(btn => {
    btn.addEventListener("click", () => {
      localStorage.setItem("site_lang", btn.dataset.lang);
      applyPageLang(btn.dataset.lang);
      renderArticle();
    });
  });

  applyPageLang(getLang());
  renderArticle();
</script>
</body>
</html>
